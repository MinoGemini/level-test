<!DOCTYPE html>
<html>
<head>
  <title>입시생 레벨 테스트</title>
  <style>
    /* 전체 배경 */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dbe6f6, #cfdff2); /* 연한 블루 그라데이션 */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 카드 */
    .card {
      background: #fefefe; /* 밝은 카드 */
      padding: 40px 35px;
      border-radius: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 15px 40px rgba(0,0,0,0.15);
      width: 360px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: inset 0 0 20px rgba(0,0,0,0.05), 0 20px 50px rgba(0,0,0,0.2);
    }

    h2 {
      margin-bottom: 25px;
      font-size: 22px;
      color: #2c3e50;
      font-weight: bold;
    }

    /* 입력 필드 */
    .field {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input[type=number] {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      transition: all 0.2s;
    }

    input[type=number]:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102,126,234,0.5);
      outline: none;
    }

    /* 버튼 */
    button {
      margin-top: 25px;
      padding: 12px 25px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }

    /* 반응형 */
    @media(max-width:400px){
      .card { width:90%; padding:30px 20px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>입시생 레벨 테스트</h2>

  <div class="field"><label>이론</label><input type="number" id="a" min="0" max="100"></div>
  <div class="field"><label>초견능력</label><input type="number" id="b" min="0" max="100"></div>
  <div class="field"><label>리듬감</label><input type="number" id="c" min="0" max="100"></div>
  <div class="field"><label>음정감</label><input type="number" id="d" min="0" max="100"></div>
  <div class="field"><label>테크닉</label><input type="number" id="e" min="0" max="100"></div>
  <div class="field"><label>나이</label><input type="number" id="f" min="0" max="100"></div>
  <div class="field"><label>장르의 이해</label><input type="number" id="g" min="0" max="100"></div>
  <div class="field"><label>터치 및 톤</label><input type="number" id="g" min="0" max="100"></div>

  <button onclick="goToResult()">결과 보기</button>
</div>

<script>
function goToResult() {
  const data = {
    a: document.getElementById('a').value || 0,
    b: document.getElementById('b').value || 0,
    c: document.getElementById('c').value || 0,
    d: document.getElementById('d').value || 0,
    e: document.getElementById('e').value || 0,
    f: document.getElementById('f').value || 0,
    g: document.getElementById('g').value || 0
  };

  localStorage.setItem("myData", JSON.stringify(data));
  window.location.href = "result.html"; // 결과 페이지 이동
}
</script>

</body>
</html>
