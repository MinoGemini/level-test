<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>경희실용음악 입시 리포트</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    /* 폰트 설정: 화면과 인쇄 모두 Pretendard 적용 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root { 
        --primary-color: #2c3e50; 
        --accent-color: #3498db; 
        --bg-color: #f4f7fa;
    }

    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, sans-serif; }

    body { background: var(--bg-color); margin: 0; padding: 0; color: var(--primary-color); line-height: 1.6; }
    
    .container { 
        max-width: 900px; margin: 40px auto; padding: 60px; 
        background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 8px; 
    }

    /* 헤더 스타일 */
    .report-header { 
        display: flex; justify-content: space-between; align-items: flex-end; 
        border-bottom: 3px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 40px; 
    }
    .report-header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
    .sub-title { font-size: 14px; color: #7f8c8d; font-weight: 600; }

    /* 테이블 공통 */
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; table-layout: fixed; }
    th { background: #f1f4f7; color: #34495e; font-weight: 700; font-size: 13px; padding: 12px; border: 1px solid #dcdde1; }
    td { padding: 12px; text-align: center; border: 1px solid #dcdde1; font-size: 15px; }
    
    .info-label { background: #f9f9f9; font-weight: 700; width: 100px; color: #2c3e50; }
    .info-input { width: 100%; border: none; background: transparent; font-size: 16px; text-align: center; font-weight: 600; outline: none; color: #2c3e50; }

    /* 텍스트 영역: 원장님 요청사항 반영 (높이 및 폰트) */
    textarea { 
        width: 100%; padding: 20px; border: 1px solid #dcdde1; 
        font-size: 15px; /* 출력 시 가독성 좋은 크기 */
        line-height: 1.8; /* 행간을 넓혀 전문적인 느낌 부여 */
        resize: none; 
        height: 180px; /* 기존보다 훨씬 여유 있는 높이 */
        background: #fdfdfd; 
        color: #34495e;
        transition: border 0.2s;
    }
    textarea:focus { border-color: var(--accent-color); outline: none; background: #fff; }

    /* 차트 레이아웃 */
    #charts { display: flex; gap: 20px; justify-content: center; margin: 30px 0; }
    .chart-box { text-align: center; flex: 1; }
    .chart-box h3 { font-size: 15px; margin-bottom: 15px; color: #576574; font-weight: 700; }
    canvas { max-width: 320px !important; max-height: 320px !important; margin: 0 auto; }

    /* 아티스트 태그 */
    .artist-tag { 
        display: inline-block; background: #f1f2f6; color: #2f3542; 
        padding: 6px 12px; border-radius: 4px; font-size: 13px; 
        font-weight: 600; margin: 3px; border: 1px solid #dfe4ea; 
    }

    /* 버튼 섹션 */
    .button-group { text-align: center; margin-top: 40px; }
    button { 
        padding: 15px 35px; border: none; background: #2c3e50; color: white; 
        border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 700; transition: 0.3s; 
    }
    button:hover { background: #34495e; transform: translateY(-2px); }

    /* 인쇄 설정 */
    @media print {
        body { background: white; }
        .container { box-shadow: none; margin: 0; padding: 40px; width: 100%; max-width: none; }
        .no-print { display: none !important; }
        textarea { border: 1px solid #eee; background: white; height: auto; min-height: 150px; overflow: hidden; }
        th { -webkit-print-color-adjust: exact; background-color: #f1f4f7 !important; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="report-header">
        <div>
            <div class="sub-title">KYUNGHEE MUSIC ACADEMY</div>
            <h1>입시 분석 리포트</h1>
        </div>
        <div style="text-align: right; font-size: 14px; color: #7f8c8d;">Evaluation Report</div>
    </div>

    <table>
        <tr>
            <td class="info-label">성 명</td><td><input type="text" id="disp-name" class="info-input" readonly></td>
            <td class="info-label">전 공</td><td><input type="text" id="disp-major" class="info-input" readonly></td>
        </tr>
        <tr>
            <td class="info-label">나 이</td><td><input type="text" id="disp-age" class="info-input" readonly></td>
            <td class="info-label">분석일시</td><td><input type="text" id="disp-date" class="info-input" readonly></td>
        </tr>
    </table>

    <div id="charts">
        <div class="chart-box">
            <h3>[ 능력치 분석 데이터 ]</h3>
            <canvas id="myChart"></canvas>
        </div>
        <div class="chart-box">
            <h3>[ 합격생 평균 데이터 ]</h3>
            <canvas id="avgChart"></canvas>
        </div>
    </div>

    <table>
        <tr><th colspan="4" style="background: var(--primary-color); color: white; font-size: 15px;">종합 평가 지표</th></tr>
        <tr>
            <td class="info-label">목표 학교</td>
            <td><input type="text" id="target-school" class="info-input" style="text-align: left; padding-left: 10px;" placeholder="학교명 입력"></td>
            <td class="info-label">평가 총점</td>
            <td style="font-weight: 800; color: #e74c3c; font-size: 1.5em;"><span id="avg"></span></td>
        </tr>
    </table>

    <table>
        <tr id="score-header"></tr>
        <tr id="score-row" style="font-weight: 800; font-size: 17px; color: var(--accent-color);"></tr>
    </table>

    <table>
        <tr><th style="text-align: left; padding-left: 20px; font-size: 14px;">추천 입시곡 및 아티스트 가이드</th></tr>
        <tr><td style="padding: 20px; text-align: left; background: #fafafa;"><div id="recommend-content"></div></td></tr>
    </table>

    <table>
        <tr><th style="text-align: left; padding-left: 20px; font-size: 14px;">장점 및 보완점</th></tr>
        <tr><td><textarea id="improvement-area" placeholder="학생의 강점과 보완해야 할 요소를 상세히 입력해주세요."></textarea></td></tr>
    </table>

    <table>
        <tr><th style="text-align: left; padding-left: 20px; font-size: 14px;">원장님 총평</th></tr>
        <tr><td><textarea id="comment-area" placeholder="향후 입시 전략 및 학생에게 전하는 총평을 입력해주세요."></textarea></td></tr>
    </table>

    <div style="text-align: center; margin-top: 30px; font-weight: 800; font-size: 20px; letter-spacing: 2px;">경희실용음악학원</div>

    <div class="button-group no-print">
        <button onclick="location.href='index.html'" style="background: #95a5a6; margin-right: 10px;">처음으로</button>
        <button onclick="saveToDB()" style="margin-right: 10px;">데이터 저장</button>
        <button onclick="window.print()" style="background: var(--accent-color);">리포트 인쇄하기</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const fieldConfigs = {
        vocal: ['이론', '악보리딩', '음감', '리듬감', '발음', '악기능력', '장르이해', '나이', '톤'],
        instrument: ['이론', '초견능력', '리듬감', '음감', '테크닉', '나이', '장르이해', '터치/톤']
    };

    const artistData = {
        '보컬': '데미로바토, 마이클부블레, 브루노마스, 아리아나그란데, 아델, 토리켈리, 비욘세, 제이콥콜리어, 존레전드, 김범수, 박효신, 나얼, 박정현, 이소라, 성시경',
        '싱송': '선우정아, 윤종신, 유재하, 유희열, 윤상, 안예은, 윤딴딴, 이무진, 볼빨간사춘기, 아이유, 딘, 이적, 장필순',
        '드럼': '데이브웨클, 스티브갯, 카즈로드리게스, 아론스피어스', '베이스': '자코, 마커스밀러', '기타': 'John Mayer, 적재', 
        '재즈피아노': '칙코리아, 빌에반스', '작곡': '퀸시존스, 류이치사카모토', '미디': '아비치, 스크릴렉스'
    };

    const savedData = JSON.parse(localStorage.getItem("myData"));
    const clientData = JSON.parse(localStorage.getItem("clientData"));

    if(!savedData || !clientData) return;

    document.getElementById('disp-name').value = clientData.name;
    document.getElementById('disp-major').value = clientData.major;
    document.getElementById('disp-age').value = clientData.age;
    document.getElementById('disp-date').value = clientData.date;

    const isVocalGroup = (clientData.major === '보컬' || clientData.major === '싱송');
    const currentLabels = isVocalGroup ? fieldConfigs.vocal : fieldConfigs.instrument;
    
    const userData = currentLabels.map((_, idx) => {
        const key = String.fromCharCode(97 + idx);
        return Number(savedData[key] || 0);
    });

    const headerRow = document.getElementById("score-header");
    const scoreRow = document.getElementById("score-row");
    currentLabels.forEach((label, idx) => {
        const th = document.createElement("th"); th.innerText = label; headerRow.appendChild(th);
        const td = document.createElement("td"); td.innerText = userData[idx]; scoreRow.appendChild(td);
    });

    const avgScore = (userData.reduce((a, b) => a + b, 0) / userData.length).toFixed(1);
    document.getElementById("avg").innerText = avgScore;

    const recommendDiv = document.getElementById('recommend-content');
    const tags = artistData[clientData.major] || "추천 데이터가 없습니다.";
    recommendDiv.innerHTML = tags.split(', ').map(n => `<span class="artist-tag"># ${n}</span>`).join('');

    const chartOptions = {
        scales: { r: { beginAtZero: true, max: 100, ticks: { display: false }, grid: { color: '#e0e0e0' } } },
        plugins: { legend: { display: false } },
        animation: false
    };

    new Chart(document.getElementById('myChart'), {
        type: 'radar',
        data: { labels: currentLabels, datasets: [{ data: userData, backgroundColor: "rgba(52,152,219,0.15)", borderColor: "#3498db", borderWidth: 2, pointRadius: 3 }] },
        options: chartOptions
    });

    new Chart(document.getElementById('avgChart'), {
        type: 'radar',
        data: { labels: currentLabels, datasets: [{ 
            data: currentLabels.map(() => 70),
            backgroundColor: "rgba(44, 62, 80, 0.05)", borderColor: "#2c3e50", borderWidth: 1, borderDash:[5,5], pointRadius: 0
        }] },
        options: chartOptions
    });
});

// 저장 함수 예시 (DB 연결 시 활용)
async function saveToDB() {
    alert("데이터베이스 저장 기능이 호출되었습니다.");
}
</script>
</body>
</html>
