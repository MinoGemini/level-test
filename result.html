<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>경희실용음악 입시 리포트</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* 1. 레이아웃 중앙 정렬 - flex 제거하고 기본 block 정렬 사용 */
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
  box-sizing: border-box;
}

body {
  font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f4f7fa;
  margin: 0;
  padding: 30px;
  color: #2c3e50;
}

h1 { text-align:center; margin-bottom:40px; font-weight:800; color:#1a2a3a; letter-spacing: -1px; }

/* 2. 테이블 강제 중앙 정렬 및 너비 고정 */
table {
  width: 100% !important;
  border-collapse: collapse; 
  margin: 0 auto 25px auto; 
  background: white; 
  border-radius: 16px; 
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
  table-layout: fixed;
}

th, td { 
  padding: 15px; 
  text-align: center; 
  vertical-align: middle;
  border-bottom: 1px solid #f0f0f0; 
}

th { 
  background: #3498db; 
  color: white; 
  font-weight: 600; 
  font-size: 15px; 
}

/* 인적사항 셀 너비 비율 고정 */
.info-label {
  font-weight: bold; 
  background: #fcfcfc; 
  width: 150px; /* 고정 너비 부여 */
}

/* 입력 필드 스타일 */
input[type=text] { 
  width: 100%;
  box-sizing: border-box;
  padding: 10px; 
  border-radius: 8px; 
  border: 1px solid #dee2e6; 
  font-size: 14px; 
  text-align: center;
}

textarea { 
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #dee2e6;
  font-size: 14px;
  resize: vertical; 
  height: 120px;
}

/* 3. 추천 아티스트 영역 (사라짐 방지) */
#recommend-content {
  text-align: left;
  padding: 5px;
  display: block; /* flex에서 block으로 변경하여 가독성 확보 */
  min-height: 40px;
}

.artist-tag {
  display: inline-block;
  background: #ebf5ff;
  color: #2980b9;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid #d0e8ff;
  margin: 4px;
}

/* 차트 섹션 */
#charts { 
  display: flex; 
  gap: 20px; 
  justify-content: center; 
  margin-bottom: 40px; 
}
#charts div { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); text-align: center; }
#charts canvas { width: 320px !important; height: 320px !important; }

/* 버튼 스타일 */
.button-group { text-align: center; margin-top: 30px; }
button {
  padding: 14px 30px; 
  border: none;
  background: #3498db; 
  color: white; 
  border-radius: 12px; 
  font-size: 16px;
  cursor: pointer; 
  font-weight: 700; 
  margin: 0 10px;
}

@media print {
  body { padding: 0; background: white; }
  .container { width: 100%; max-width: none; padding: 0; }
  button, .no-print { display: none !important; }
}
</style>
</head>

<body>

<div class="container">
  <h1>경희실용음악 입시 리포트</h1>

  <table>
    <tr><th colspan="4">내담자 인적사항</th></tr>
    <tr>
      <td class="info-label">이름</td><td><input type="text" id="disp-name"></td>
      <td class="info-label">나이</td><td><input type="text" id="disp-age"></td>
    </tr>
    <tr>
      <td class="info-label">내담일</td><td><input type="text" id="disp-date"></td>
      <td class="info-label">전공</td><td><input type="text" id="disp-major"></td>
    </tr>
  </table>

  <div id="charts" class="no-print">
    <div><h3>내 점수 분석</h3><canvas id="myChart"></canvas></div>
    <div><h3>평균 기준 점수</h3><canvas id="avgChart"></canvas></div>
  </div>

  <table>
    <tr><th colspan="4">입시 평가결과</th></tr>
    <tr>
      <td class="info-label">목표학교</td><td><input type="text" id="target-school"></td>
      <td class="info-label">평균 총점</td><td style="font-weight: 800; color: #e74c3c; font-size: 1.2em;"><span id="avg"></span></td>
    </tr>
  </table>

  <table>
    <tr><th colspan="7">상세 항목 평가</th></tr>
    <tr id="score-header" style="background: #fcfcfc; font-size: 13px;"></tr>
    <tr id="score-row" style="font-weight: bold; font-size: 16px; color: #2980b9;"></tr>
  </table>

  <table>
    <tr><th>추천 입시곡 및 아티스트 가이드</th></tr>
    <tr>
      <td style="padding: 20px; background: #fafafa;">
        <div id="recommend-content"></div>
      </td>
    </tr>
  </table>

  <table>
    <tr><th>장점 및 보완점</th></tr>
    <tr><td><textarea id="improvement-area" placeholder="학생의 강점과 구체적인 연습 방향을 적어주세요."></textarea></td></tr>
  </table>

  <table>
    <tr><th>원장님 총평</th></tr>
    <tr><td><textarea id="comment-area" placeholder="입시 성공을 위한 최종 조언을 입력해주세요."></textarea></td></tr>
  </table>

  <div class="button-group no-print">
    <button onclick="goBack()" style="background: #95a5a6;">새로 작성</button>
    <button onclick="saveToDB()">결과 저장하기</button>
    <button onclick="window.print()">리포트 출력하기</button>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const artistData = {
    '드럼': '데이브웨클, 스티브갯, 카즈로드리게스, 아론스피어스, 로버트스팟시라이트, 김승호, 은아경, 조찬우',
    '베이스': '자코, 마이클리그, 마커스밀러, 나단이스트, 리차드보나, 에스페란자스팔딩, 구본암, 로비크, 최인성',
    '기타': '마크레티어리, 팻메쓰니, 노만브라운, 존메이어, 마이클랜도우, 스캇핸더슨, 척롭, 폴잭슨주니어, 적재',
    '재즈피아노': '오스카피터슨, 칙코리아, 키스자렛, 코리헨리, 허비행콕, 빌에반스, 송영주, 윤석철, 김요한',
    '보컬': '데미로바토, 마이클부블레, 브루노마스, 아리아나그란데, 아델, 토리켈리, 비욘세, 제이콥콜리어, 존레전드, 김범수, 박효신, 나얼, 박정현, 이소라, 성시경',
    '작곡': '퀸시존스, 데이빗포스터, 존윌리암스, 한스짐머, 엔니오모니꼬네, 류이치사카모토, 하워드쇼어, 정재일, 모그',
    '싱송': '선우정아, 윤종신, 유재하, 유희열, 윤상, 안예은, 윤딴딴, 이무진, 볼빨간사춘기, 아이유, 딘, 이적, 장필순',
    '미디': '아비치, 마틴개릭스, 앨런워커, 제드, 써드파티, 카슈미르, 다비드게타, 체인스모커스, 스크릴렉스, 마시멜로'
  };

  window.supabaseClient = supabase.createClient(
    "https://gnveewglucbnmuvjupst.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdudmVld2dsdWNibm11dmp1cHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3Mjk1OTgsImV4cCI6MjA4OTMwNTU5OH0.9bu4YcGX1DM4gxy1vPr2KclJV7KIhgLStLs9eEZdXuk"
  );

  const labels = ['초견능력','리듬감','음정감','테크닉','나이','장르의 이해','터치 및 톤'];
  const savedData = JSON.parse(localStorage.getItem("myData")) || {a:50,b:50,c:50,d:50,e:50,f:50,g:50};
  const clientData = JSON.parse(localStorage.getItem("clientData")) || {name:'', age:'', major:'', date:''};

  document.getElementById('disp-name').value = clientData.name || '';
  document.getElementById('disp-age').value = clientData.age || '';
  document.getElementById('disp-major').value = clientData.major || '';
  document.getElementById('disp-date').value = clientData.date || '';

  // 추천 아티스트 렌더링 (클래스 기반으로 안정화)
  const recommendDiv = document.getElementById('recommend-content');
  const major = clientData.major;
  if (major && artistData[major]) {
    const list = artistData[major].split(', ');
    recommendDiv.innerHTML = list.map(name => `<span class="artist-tag"># ${name}</span>`).join('');
  } else {
    recommendDiv.innerHTML = "<span style='color:#95a5a6;'>전공에 맞는 추천 리스트를 불러올 수 없습니다.</span>";
  }

  const userData = [Number(savedData.a), Number(savedData.b), Number(savedData.c), Number(savedData.d),
                    Number(savedData.e), Number(savedData.f), Number(savedData.g)];
  const avgData = [50,50,50,50,50,50,50];
  const avgScore = (userData.reduce((a,b)=>a+Number(b),0)/userData.length).toFixed(1);
  document.getElementById("avg").innerText = avgScore;

  const headerRow = document.getElementById("score-header");
  const scoreRow = document.getElementById("score-row");
  labels.forEach((label, idx)=>{
    const th = document.createElement("th"); th.innerText = label; headerRow.appendChild(th);
    const td = document.createElement("td"); td.innerText = userData[idx]; scoreRow.appendChild(td);
  });

  new Chart(document.getElementById('myChart'),{
    type:'radar',
    data:{ labels, datasets:[{ data:userData, backgroundColor:"rgba(52,152,219,0.2)", borderColor:"#3498db", borderWidth:3}]},
    options: { scales:{ r:{ beginAtZero:true, max:100 } }, plugins:{ legend:{ display:false } } }
  });
  new Chart(document.getElementById('avgChart'),{
    type:'radar',
    data:{ labels, datasets:[{ data:avgData, backgroundColor:"rgba(149,165,166,0.1)", borderColor:"#95a5a6", borderWidth:2, borderDash:[5,5]}]},
    options: { scales:{ r:{ beginAtZero:true, max:100 } }, plugins:{ legend:{ display:false } } }
  });

  window.goBack = () => window.location.href="index.html";
  window.saveToDB = async () => {
    const targetschool = document.getElementById('target-school').value;
    const improvement = document.getElementById('improvement-area').value;
    const comment = document.getElementById('comment-area').value;
    const recommendStr = artistData[major] || "";

    const { error } = await supabaseClient.from('students').insert([{
      ...clientData, scores: savedData, avg: avgScore, targetschool,
      recommend: recommendStr, improvement, comment
    }]);
    if(error) alert("저장 실패 ❌"); else alert("저장 성공 ✅");
  };
});
</script>
</body>
</html>
