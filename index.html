<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>경희실용음악 입시 리포트 - 내담자 인적사항</title>
  <style>
    /* 핵심: 모든 요소의 너비 계산 방식을 통일합니다 */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dbe6f6, #cfdff2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fefefe;
      padding: 40px 35px;
      border-radius: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 15px 40px rgba(0,0,0,0.15);
      width: 380px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 22px;
      color: #2c3e50;
      font-weight: bold;
    }

    .field {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }

    /* 모든 입력창 스타일 통합 (text, date, select 모두 동일하게) */
    input[type=text],
    input[type=date],
    select#major {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      background-color: #fefefe;
      transition: all 0.2s;
      display: block; /* 줄바꿈 확실히 */
    }

    input:focus, select:focus {
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102,126,234,0.5);
      outline: none;
    }

    /* 전공 선택 박스(Select) 전용 화살표 디자인 */
    select#major {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 1em;
      cursor: pointer;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      background: #667eea;
      color: white;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="card">
  <h2>내담자 인적사항 입력</h2>

  <div class="field"><label>이름</label><input type="text" id="name"></div>
  <div class="field"><label>나이</label><input type="text" id="age"></div>
  
  <div class="field">
  <label for="major">전공</label>
  <select id="major">
    <option value="">전공을 선택하세요</option>
    <option value="보컬">보컬</option>
    <option value="드럼">드럼</option>
    <option value="베이스">베이스</option>
    <option value="기타">기타</option>
    <option value="재즈피아노">재즈피아노</option>
    <option value="작곡">작곡</option>
    <option value="싱송">싱송</option>
    <option value="미디">미디</option>
  </select>
  
</div>

  <div class="field">
    <label>내담일</label>
    <input type="date" id="date">
  </div>
  
  <button onclick="goToTest()">다음 단계: 레벨 테스트</button>
</div>

<script>
function goToTest() {
  const name = document.getElementById('name').value;
  const major = document.getElementById('major').value;

  if(!name || !major) {
    alert("이름과 전공을 입력해주세요.");
    return;
  }

  const clientData = {
    name: name,
    age: document.getElementById('age').value,
    major: major,
    date: document.getElementById('date').value
  };

  localStorage.setItem("clientData", JSON.stringify(clientData));
  window.location.href = "test.html";
}
</script>

</body>
</html>
