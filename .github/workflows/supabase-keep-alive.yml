name: Supabase Keep Alive (Insert & Delete)

on:
  schedule:
    # 매주 월요일, 목요일 새벽 4시(KST) 자동 실행
    - cron: '0 19 * * 0,3'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Insert and Delete Ping Log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1. 데이터 등록 (INSERT)
          RESPONSE=$(curl -s -X POST "${{ env.SUPABASE_URL }}/rest/v1/ping_log" \
            -H "apikey: ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{}')
          
          # 응답에서 id 값만 파싱
          ROW_ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | grep -o '[^"]*$')
          
          if [ -z "$ROW_ID" ]; then
            echo "❌ Insert failed or ID not found. Response: $RESPONSE"
            exit 1
          fi
          
          echo "✅ Inserted log successfully. ID: $ROW_ID"
          
          # 잠시 2초 쉬고...
          sleep 2
          
          # 2. 방금 넣은 데이터 바로 삭제 (DELETE)
          DELETE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "${{ env.SUPABASE_URL }}/rest/v1/ping_log?id=eq.$ROW_ID" \
            -H "apikey: ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}")
          
          if [ "$DELETE_STATUS" -eq 200 ] || [ "$DELETE_STATUS" -eq 204 ]; then
            echo "🗑️ Deleted log successfully. Database is clean!"
          else
            echo "❌ Delete failed. HTTP Status: $DELETE_STATUS"
            exit 1
          fi
